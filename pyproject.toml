[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meterspec"
version = "1.0.0"
description = "Electrical meter selection and sizing tool"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pydantic>=2.9",
  "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
