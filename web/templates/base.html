<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MeterSpec</title>
  <style>
    :root { font-family: Arial, sans-serif; background:#f5f6f3; color:#17201b; }
    body { margin:0; }
    header { background:#173c43; color:white; padding:18px 24px; display:flex; justify-content:space-between; align-items:center; border-bottom:4px solid #c48a38; }
    h1,h2,h3 { margin:0 0 10px; }
    nav { display:flex; gap:8px; flex-wrap:wrap; }
    nav a,.button { color:white; background:#245862; border:1px solid #729199; border-radius:6px; padding:8px 10px; text-decoration:none; cursor:pointer; }
    main { max-width:1400px; margin:0 auto; padding:22px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px; }
    .panel { background:white; border:1px solid #d4dcd2; border-radius:8px; padding:16px; margin-bottom:16px; }
    label { display:block; font-size:13px; color:#516058; margin:8px 0 3px; }
    input,select { width:100%; box-sizing:border-box; padding:8px; border:1px solid #b8c2bd; border-radius:5px; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th,td { border-bottom:1px solid #d4dcd2; padding:9px; text-align:left; vertical-align:top; }
    .status { font-size:28px; font-weight:700; color:#173c43; }
    .fail { color:#b42318; font-weight:700; }
    .pass { color:#19734a; font-weight:700; }
    .tag { display:inline-block; border:1px solid #b8c2bd; border-radius:999px; padding:4px 8px; margin:2px; background:#f5f6f3; }
  </style>
</head>
<body>
<header>
  <div><h1>MeterSpec</h1><div>Electrical Meter Selection & Sizing Tool</div></div>
  <nav><a href="/">New Selection</a><a href="/?scenario=industrial_retrofit">Saved Selections</a><a href="/catalog">Catalog</a><a href="/compare">Compare</a><a href="/reports/commercial_facility.html">Reports</a><a href="/rules">Engineering Rules</a><a href="/docs">API</a></nav>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
